[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocap-kdd-artifact"
version = "0.1.0"
description = "Anonymous implementation of OCAP for personalized mental-health monitoring"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.0",
  "PyYAML>=6.0",
  "pyarrow>=14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
