dataset: studentlife
seed: 42
device: cpu
model: {hidden_dim: 32, depth: 2, num_heads: 4, ff_mult: 4, lora_rank: 4, lora_alpha: 8.0, dropout: 0.0}
training:
  backbone_lr: 0.0003
  adapter_lr: 0.001
  focal_gamma: 2.0
  focal_alpha: 0.75
  positive_class_weight: 5.0
  weight_decay: 0.0001
  route_grad_ema_decay: 0.95
  backbone_lr_scale: 0.3
  route_grad_clip_norm: 1.0
  smoothing_window: 3
  threshold_mode: in_window
  threshold_window: 500
  threshold_grid_size: 101
  threshold_min_history: 100
  threshold_refresh_every: 50
grouping:
  global_warmup_steps: 100
  individual_warmup_steps: 5
  min_observations: 5
  regroup_interval: 100
  k_min: 4
  min_pair_cosine: 0.0
  cfl_coherence_threshold: 0.55
  cfl_disagreement_cosine_threshold: 0.20
  warmup_initial_min_samples: 5
  warmup_initial_min_samples_fallback: 1
  warmup_initial_min_eligible_users_fallback: 2
  warmup_initial_force_accept: true
  warmup_initial_target_groups: 0
  warmup_initial_min_groups: 2
  warmup_signature_count: 5
  warmup_min_eligible_users: 8
  warmup_fallback_signature_count: 1
  warmup_fallback_min_users: 2
  warmup_initial_max_groups: 12
refinements:
  per_user_bias: true
  per_user_bias_lr: 0.005
  verified_split: true
  split_loss_margin: 0.005
  split_min_users: 8
  split_min_events: 30
  split_holdout_min_users: 5
  split_max_groups: 8
  split_pred_posrate_delta_tol: 0.10
  split_cohesion_tolerance: 0.05
  mature_refine: true
  mature_min_observations: 20
  mature_min_buffer: 5
  mature_loss_margin: 0.01
  mature_every: 10
evaluation: {first_k: [5, 10, 20], require_complete_first_k: true}
