dataset: globem
seed: 42
device: cpu
model: {hidden_dim: 16, depth: 1, num_heads: 2, ff_mult: 2, lora_rank: 4, lora_alpha: 8.0, dropout: 0.0}
training:
  backbone_lr: 0.0003
  adapter_lr: 0.005
  focal_gamma: 2.0
  focal_alpha: 0.75
  positive_class_weight: 5.0
  weight_decay: 0.0001
  gradient_history_decay: 0.95
  backbone_lr_scale: 0.3
  gradient_direction_clip_norm: 1.0
  smoothing_window: 3
  threshold_mode: in_window
  threshold_window: 500
  threshold_grid_size: 101
  threshold_min_history: 100
  threshold_refresh_every: 50
  threshold_default: 0.5
  user_threshold_posrate_bias: true
  user_threshold_posrate_bias_alpha: 0.09
  user_threshold_min_samples: 3
grouping:
  backbone_warmup_steps: 120
  individual_warmup_steps: 2
  min_observations: 5
  group_update_interval: 120
  minimum_group_count: 4
  min_pair_cosine: 0.0
  cfl_coherence_threshold: 0.55
  cfl_disagreement_cosine_threshold: 0.20
  group_merge_alpha: 0.3
  warmup_gradient_history_enabled: true
  warmup_initial_grouping_enabled: true
  warmup_initial_min_samples: 5
  warmup_initial_min_samples_fallback: 1
  warmup_initial_min_grouping_users_fallback: 2
  warmup_initial_force_accept: true
  warmup_initial_target_groups: 0
  warmup_initial_min_groups: 2
  warmup_gradient_history_count: 5
  warmup_min_grouping_users: 10
  warmup_fallback_gradient_history_count: 1
  warmup_fallback_min_grouping_users: 2
  warmup_initial_max_groups: 12
  warmup_gradient_history_keep_after_initial: false
  personal_adapter_group_init_enabled: true
  personal_adapter_group_init_min_records: 3
  personal_adapter_group_init_weight: 0.35
  low_evidence_adapter_mixing_enabled: true
  low_evidence_mixing_max_records: 20
  low_evidence_mixing_eta: 0.25
  low_evidence_prior_global: 0.05
  low_evidence_prior_personal: 0.25
  low_evidence_prior_group: 0.70
refinements:
  per_user_bias: true
  per_user_bias_lr: 0.005
  per_user_bias_l2: 0.001
  per_user_bias_clip: 2.0
  per_user_bias_init_mode: group_mean
  per_user_bias_init_group_weight: 0.5
  verified_split: true
  split_loss_margin: 0.005
  split_min_users: 10
  split_min_events: 50
  split_holdout_min_users: 5
  split_max_groups: 8
  split_pred_posrate_delta_tol: 0.10
  split_cohesion_tolerance: 0.05
  split_holdout_fallback_to_recent: false
  reassignment_enabled: true
  reassignment_min_observations: 20
  reassignment_min_buffer: 5
  reassignment_loss_margin: 0.01
  reassignment_every: 10
evaluation: {first_k: [5, 10], require_complete_first_k: true}
